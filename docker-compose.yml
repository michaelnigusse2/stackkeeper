# Local development, and a working starting point for self-hosting.
#
#   docker compose up -d db
#   pnpm --filter @stackkeeper/db migrate
#   pnpm --filter @stackkeeper/web auth:migrate
#   pnpm dev
#
# Bringing everything up, including the app and worker images:
#   docker compose --profile full up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stackkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackkeeper}
      POSTGRES_DB: stackkeeper
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackkeeper -d stackkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["full"]
    image: postgres:16-alpine
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://stackkeeper:${POSTGRES_PASSWORD:-stackkeeper}@db:5432/stackkeeper
    volumes:
      - ./packages/db:/db:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache bash coreutils >/dev/null && bash /db/scripts/migrate.sh"]
    restart: "no"

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://stackkeeper_app:${APP_DB_PASSWORD:-stackkeeper_app}@db:5432/stackkeeper
      DATABASE_ADMIN_URL: postgres://stackkeeper:${POSTGRES_PASSWORD:-stackkeeper}@db:5432/stackkeeper
      AUTH_DATABASE_URL: postgres://stackkeeper:${POSTGRES_PASSWORD:-stackkeeper}@db:5432/stackkeeper
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_ADMIN_URL: postgres://stackkeeper:${POSTGRES_PASSWORD:-stackkeeper}@db:5432/stackkeeper
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      STACKKEEPER_SECRET_KEY: ${STACKKEEPER_SECRET_KEY:-${BETTER_AUTH_SECRET}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      NODE_ENV: production
    restart: unless-stopped

volumes:
  pgdata:
